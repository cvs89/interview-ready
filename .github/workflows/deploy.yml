name: Production Deployment Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to deploy"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'interview-ready-52479' }}
  GCP_REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
  ARTIFACT_REGISTRY: ${{ secrets.ARTIFACT_REGISTRY || 'us-central1-docker.pkg.dev/interview-ready-52479/interview-ready' }}

jobs:
  quality-gate:
    name: Verify Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          cd apps/api && uv sync --extra dev

      - name: Run Backend Checks (Lint, Mypy, Tests)
        run: |
          cd apps/api
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy app
          uv run pytest -q

      - name: Run Web Checks (Lint, Typecheck, Tests, Build)
        env:
          NEXT_PUBLIC_API_URL: https://interview-ready.web.app
        run: |
          npm run lint:web
          npm run typecheck:web
          npm run test:web
          npm run build:web

  build-and-push:
    name: Build & Push Container Images
    needs: quality-gate
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Image Tag
        id: set-tag
        run: |
          TAG="$(git rev-parse --short HEAD)"
          echo "IMAGE_TAG=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        if: ${{ env.GCP_PROJECT_ID != '' && secrets.GCP_SA_KEY != '' }}
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        if: ${{ env.GCP_PROJECT_ID != '' && secrets.GCP_SA_KEY != '' }}
        run: |
          gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        run: |
          docker build \
            -t "${{ env.ARTIFACT_REGISTRY }}/api:${{ steps.set-tag.outputs.IMAGE_TAG }}" \
            -t "${{ env.ARTIFACT_REGISTRY }}/api:latest" \
            -f apps/api/Dockerfile apps/api

      - name: Build Web Docker Image
        run: |
          docker build \
            -t "${{ env.ARTIFACT_REGISTRY }}/web:${{ steps.set-tag.outputs.IMAGE_TAG }}" \
            -t "${{ env.ARTIFACT_REGISTRY }}/web:latest" \
            -f apps/web/Dockerfile apps/web

      - name: Push Container Images to Artifact Registry
        if: ${{ env.GCP_PROJECT_ID != '' && secrets.GCP_SA_KEY != '' }}
        run: |
          docker push "${{ env.ARTIFACT_REGISTRY }}/api:${{ steps.set-tag.outputs.IMAGE_TAG }}"
          docker push "${{ env.ARTIFACT_REGISTRY }}/api:latest"
          docker push "${{ env.ARTIFACT_REGISTRY }}/web:${{ steps.set-tag.outputs.IMAGE_TAG }}"
          docker push "${{ env.ARTIFACT_REGISTRY }}/web:latest"

  run-migrations:
    name: Execute Single-Run Database Migration
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: ${{ env.GCP_PROJECT_ID != '' && secrets.GCP_SA_KEY != '' }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Execute Cloud Run Migration Job
        run: |
          gcloud run jobs execute interview-ready-migrations \
            --region "${{ env.GCP_REGION }}" \
            --wait

  deploy-services:
    name: Deploy Cloud Run & Firebase Hosting
    needs: [build-and-push, run-migrations]
    runs-on: ubuntu-latest
    if: ${{ env.GCP_PROJECT_ID != '' && secrets.GCP_SA_KEY != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy API Service to Cloud Run
        run: |
          gcloud run services update interview-ready-api \
            --image "${{ env.ARTIFACT_REGISTRY }}/api:${{ needs.build-and-push.outputs.image_tag }}" \
            --region "${{ env.GCP_REGION }}"

      - name: Deploy Web Service to Cloud Run
        run: |
          gcloud run services update interview-ready-web \
            --image "${{ env.ARTIFACT_REGISTRY }}/web:${{ needs.build-and-push.outputs.image_tag }}" \
            --region "${{ env.GCP_REGION }}"

      - name: Setup Node.js for Firebase CLI
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Firebase Hosting Configuration
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx firebase-tools deploy --only hosting --project "${{ env.GCP_PROJECT_ID }}" --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Post-Deployment Smoke Tests
        run: |
          echo "Running post-deployment smoke tests..."
          API_URL="$(gcloud run services describe interview-ready-api --region "${{ env.GCP_REGION }}" --format='value(status.url)')"
          WEB_URL="$(gcloud run services describe interview-ready-web --region "${{ env.GCP_REGION }}" --format='value(status.url)')"
          
          curl --fail --retry 3 --retry-delay 5 "${API_URL}/health/live" || exit 1
          curl --fail --retry 3 --retry-delay 5 "${API_URL}/health/ready" || exit 1
          curl --fail --retry 3 --retry-delay 5 "${WEB_URL}/api/health" || exit 1
          echo "All production smoke tests passed successfully."

  deploy-firebase-edge:
    name: Deploy Firebase Hosting (Edge CDN)
    needs: quality-gate
    runs-on: ubuntu-latest
    if: ${{ secrets.FIREBASE_TOKEN != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx -y firebase-tools@latest deploy --only hosting --project "${{ env.GCP_PROJECT_ID }}" --token "${{ secrets.FIREBASE_TOKEN }}"

  desktop-release-guard:
    name: Desktop Release Guard (Signing & Notarization Verification)
    runs-on: ubuntu-latest
    steps:
      - name: Validate Desktop Publishing Prerequisites
        run: |
          echo "Checking desktop binary publication constraints..."
          echo "Desktop installers are guarded and NOT published automatically on web/backend commits."
          echo "Publishing requires explicitly configured codesigning certificates and notarization keys (macOS Apple Developer ID & Windows Authenticode)."
