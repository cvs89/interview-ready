name: Firestore backend
on:
  pull_request:
  push:
    branches: [main]
jobs:
  firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Install locked API dependencies
        working-directory: apps/api
        run: uv sync --frozen --extra dev
      - name: Check Firestore code
        working-directory: apps/api
        run: |
          uv run ruff check app/firestore_backend app/services/backend.py tests/test_firestore_backend.py
          uv run mypy app
      - name: Run real Firestore emulator contracts and races
        run: >-
          npx --yes firebase-tools@15.37.0 emulators:exec --only firestore
          --project demo-interview-ready --config firebase.firestore.json
          'cd apps/api && uv run pytest tests/test_firestore_backend.py -v'
