apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: interview-ready-api
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/description: "Interview Ready FastAPI Backend Service"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "20"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/execution-environment: gen2
        # Connect to Cloud SQL via unix domain socket
        run.googleapis.com/cloudsql-instances: "${GCP_PROJECT_ID}:${GCP_REGION}:${CLOUD_SQL_INSTANCE}"
    spec:
      serviceAccountName: interview-ready-api-sa@${GCP_PROJECT_ID}.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: ${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/interview-ready/api:latest
          resources:
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          ports:
            - name: http1
              containerPort: 8000
          env:
            - name: APP_NAME
              value: "Interview Ready API"
            - name: APP_ENV
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
            - name: WEB_ORIGINS
              value: "https://${FIREBASE_PROJECT_ID}.web.app,https://${CUSTOM_DOMAIN}"
            - name: DB_POOL_SIZE
              value: "5"
            - name: DB_MAX_OVERFLOW
              value: "10"
            - name: DB_POOL_TIMEOUT
              value: "30"
            - name: DB_POOL_RECYCLE
              value: "1800"
            - name: DB_POOL_PRE_PING
              value: "true"
            - name: GCS_BUCKET_NAME
              value: "${GCS_BUCKET_NAME}"
            # Secrets injected from Google Secret Manager
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: interview-ready-database-url
                  key: latest
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: interview-ready-redis-url
                  key: latest
            - name: SESSION_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: interview-ready-session-jwt-secret
                  key: latest
            - name: WEBHOOK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: interview-ready-webhook-signing-secret
                  key: latest
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: interview-ready-livekit-api-key
                  key: latest
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: interview-ready-livekit-api-secret
                  key: latest
            - name: LIVEKIT_URL
              valueFrom:
                secretKeyRef:
                  name: interview-ready-livekit-url
                  key: latest
          startupProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 6
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 3
