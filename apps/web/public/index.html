<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview Ready — Live</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px;
      max-width: 540px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 {
      color: #38bdf8;
      margin-top: 0;
      font-size: 28px;
    }
    p {
      color: #94a3b8;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      background: #065f46;
      color: #34d399;
      padding: 6px 14px;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .links {
      margin-top: 24px;
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 500;
      padding: 8px 16px;
      border: 1px solid #0284c7;
      border-radius: 8px;
      transition: all 0.2s;
    }
    a:hover {
      background: #0284c7;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">● Firebase Hosting Active</div>
    <h1>Interview Ready Platform</h1>
    <p>The high-concurrency Mock Interview Marketplace is successfully connected to Firebase Hosting edge CDN.</p>
    <div class="links">
      <a href="https://github.com/cvs89/interview-ready" target="_blank">GitHub Repository</a>
    </div>
  </div>
</body>
</html>
