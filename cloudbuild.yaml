steps:
  # 1. Build API Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/interview-ready-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/interview-ready-api:latest'
      - '-f'
      - 'apps/api/Dockerfile'
      - 'apps/api'

  # 2. Push API image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/interview-ready-api:$COMMIT_SHA']

  # 3. Deploy API to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'interview-ready-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/interview-ready-api:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--port'
      - '8000'

  # 4. Build Web Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/interview-ready-web:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/interview-ready-web:latest'
      - '-f'
      - 'apps/web/Dockerfile'
      - '.'

  # 5. Push Web image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/interview-ready-web:$COMMIT_SHA']

  # 6. Deploy Web to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'interview-ready-web'
      - '--image'
      - 'gcr.io/$PROJECT_ID/interview-ready-web:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'

images:
  - 'gcr.io/$PROJECT_ID/interview-ready-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/interview-ready-web:$COMMIT_SHA'
